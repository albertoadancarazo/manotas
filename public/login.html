<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Acceso taller · Manotas</title>
<style>body{margin:0;background:#f4f0e6;color:#242321;font:1rem/1.5 system-ui,sans-serif;display:grid;min-height:100dvh;place-items:center}main{max-width:26rem;width:calc(100% - 4rem);padding:2rem}h1{font-family:Impact,'Arial Narrow',sans-serif;font-size:2.8rem;font-weight:400;line-height:1.1}small{letter-spacing:.15em}label{display:block;margin-top:1.2rem}input,button{box-sizing:border-box;width:100%;font:inherit;padding:.8rem;border:1px solid #6b655c;border-radius:3px}input{background:#faf8f2}button{margin-top:1.5rem;background:#242321;color:#fff;border-color:#242321;cursor:pointer;transition:background .15s}button:hover{background:#514334}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #b44c13;outline-offset:3px}#error{color:#912c19;min-height:1.5em}a{color:inherit}</style></head>
<body><main><small>TALLERES MANOTAS</small><h1>Acceso al taller</h1><form id="login"><label for="email">Correo electrónico</label><input id="email" type="email" name="email" autocomplete="username" required maxlength="254"><label for="password">Contraseña</label><input id="password" type="password" name="password" autocomplete="current-password" required maxlength="1024"><button>Entrar</button><p id="error" role="alert"></p></form><a href="/">Volver a la web</a></main>
<script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=e.target.querySelector('button'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const res=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!res.ok)throw new Error(res.status===401?'Correo o contraseña incorrectos.':'No se ha podido iniciar sesión.');const data=await res.json(),next=new URLSearchParams(location.search).get('next');location.assign(next&&next.startsWith('/')&&!next.startsWith('//')&&!next.includes('\\')?next:data.user.role==='ADMIN'?'/admin/dashboard':data.user.role==='INSURER'?'/api/insurer/orders':'/taller');}catch(err){error.textContent=err.message;button.disabled=false;}});</script></body></html>
